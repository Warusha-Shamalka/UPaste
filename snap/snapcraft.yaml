name: upaste
base: core24
version: '0.1.0'
summary: Local clipboard history manager
description: |
  UPaste keeps a searchable local history of copied text. Review, copy,
  delete, and clear saved entries, or pause clipboard monitoring at any time.
grade: devel
confinement: strict

apps:
  upaste:
    command: usr/bin/clipboard_manager
    desktop: usr/share/applications/upaste.desktop
    extensions:
      - gnome
    plugs:
      - wayland
      - x11

parts:
  upaste:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - pkg-config
      - libgtk-3-dev
      - libsqlite3-dev
    stage-packages:
      - libsqlite3-0
